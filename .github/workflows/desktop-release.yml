name: Build desktop releases
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: HTTPS directory where these immutable artifacts will be uploaded
        required: true
        type: string
      channel:
        description: Release channel
        default: stable
        type: string
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x86_64
            bundles: nsis
          - os: macos-15
            target: aarch64-apple-darwin
            platform: darwin
            arch: aarch64
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin
            arch: x86_64
            bundles: app,dmg
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x86_64
            bundles: appimage
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: aarch64
            bundles: appimage
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      ULIX_ARTIFACT_PUBLIC_KEY: ${{ vars.ULIX_ARTIFACT_PUBLIC_KEY }}
      ULIX_MANIFEST_PUBLIC_KEY: ${{ vars.ULIX_MANIFEST_PUBLIC_KEY }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ULIX_RELEASE_BASE_URL: ${{ inputs.base_url }}
      ULIX_RELEASE_CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev libfuse2t64 cmake
      - run: npm ci
      - name: Configure verification keys
        run: python vendor/ulix-update/tools/configure.py .
      - name: Build Ulysses runtime
        shell: bash
        run: |
          if [ -f tools/build-runtime.py ]; then python tools/build-runtime.py; fi
      - name: Validate release inputs
        run: python vendor/ulix-update/tools/preflight.py . --release
      - name: Build update helper
        run: cargo build --manifest-path vendor/ulix-update/Cargo.toml --release --target ${{ matrix.target }} -p ulix-update-helper
      - name: Build and sign application
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Collect artifacts and release records
        shell: bash
        run: python vendor/ulix-update/tools/collect-release.py . --target '${{ matrix.target }}' --platform '${{ matrix.platform }}' --arch '${{ matrix.arch }}' --base-url "$ULIX_RELEASE_BASE_URL" --channel "$ULIX_RELEASE_CHANNEL"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-output/${{ matrix.platform }}-${{ matrix.arch }}/
          if-no-files-found: error
# This workflow creates reviewable build artifacts. Upload them to the exact
# HTTPS URLs and publish the JSON records as a separate, intentional release.
# Add the existing DigiCert initialization/signing steps before the Tauri build
# for Windows publisher signing; see RELEASES.md. Tauri updater signing is
# independent and mandatory on every platform.
