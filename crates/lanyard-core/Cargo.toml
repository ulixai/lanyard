[package]
name = "lanyard-core"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
[features]
default = []
native = ["dep:keyring"]
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
subtle = "2"
tempfile = "3"
fernet = { version = "0.2", default-features = false, features = ["rustcrypto"] }
rsa = { version = "0.9", features = ["pem"] }
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem"] }
keyring = { version = "3", optional = true, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Credentials", "Win32_Foundation"] }
