[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lanyard-vault"
version = "0.1.0"
description = "A locally hosted BYOK manager and OS Keyring bridge."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0.0",
    "pywebview>=5.0.0",
    "keyring>=24.0.0",
    "cryptography>=42.0.0",
    "platformdirs>=4.0.0",
    "pystray>=0.19.0",
    "Pillow>=10.0.0"
]