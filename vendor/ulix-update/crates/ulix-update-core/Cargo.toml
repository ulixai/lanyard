[package]
name = "ulix-update-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Signed ULIX update protocol and portable deployment engine"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ed25519-dalek = "2"
base64 = "0.22"
hex = "0.4"
minisign-verify = "0.2"
sha2 = "0.10"
semver = "1"
url = { version = "2", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["fs", "io-util", "time"] }
futures-util = "0.3"
tempfile = "3"
zip = { version = "6", default-features = false, features = ["deflate"] }
fs2 = "0.4"

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
